name: PHP and MySQL checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
          MYSQL_DATABASE: pina_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl
          coverage: none
      - run: find app public deploy tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: node --check dist/app.js
      - run: php tests/unit.php
      - name: Create ephemeral test configuration
        run: |
          php -r '$c=["base_url"=>"https://pina.test","debug"=>true,"db"=>["host"=>"127.0.0.1","port"=>3306,"name"=>"pina_test","user"=>"root","password"=>"local-test-only"],"cash_address"=>"Test","max_amount_minor"=>100000000];file_put_contents(getenv("RUNNER_TEMP")."/pina-test.php","<?php return ".var_export($c,true).";");'
      - run: php tests/integration.php
        env:
          PINA_CONFIG: ${{ runner.temp }}/pina-test.php
          DB_NAME: pina_test
